<html>
<head>
<title>Blog Layout with Sidebar</title>
</head>
<body>

  <main>
    <article>
      <h1>My Blog Post</h1>
      <p>
        This is the main content of the blog post. It contains the article
        text that readers focus on.
      </p>

      <section>
        <h2>Details</h2>
        <p>
          More information about the topic is discussed in this section.
        </p>
      </section>
    </article>

    <aside>
      <h3>Sidebar</h3>
      <ul>
        <li>Recent Posts</li>
        <li>Categories</li>
        <li>About the Author</li>
      </ul>
    </aside>
  </main>

</body>
</html>
