<html>
<head>
 <title>Main Element Example</title>
</head>
<body>

  <header>
    <h1>My Website</h1>
  </header>

  <main>
    <h2>Welcome</h2>
    <p>
      This is the primary content of the webpage. The <main> element
      contains the most important information for users.
    </p>

    <section>
      <h3>About</h3>
      <p>
        This section provides details about the website.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 My Website</p>
  </footer>

</body>
</html>
